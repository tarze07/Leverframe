[package]
name = "leverframe"
version = "0.1.0-alpha.1"
description = "Terminal z edytorem dla agentów CLI"
edition = "2021"
rust-version = "1.77.2"

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "leverframe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true

[package]
name = "leverframe"
version = "0.0.1"
description = "Terminal z edytorem dla agentów CLI"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "leverframe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true

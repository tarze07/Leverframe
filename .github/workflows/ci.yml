name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-version.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  app:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      - name: Build application
        run: npm run tauri -- build --no-bundle
      - name: Package portable ZIP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh packaging/windows/make-portable.ps1
      - name: Check the portable executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The C runtime must be linked statically (no "VC++ Redistributable" needed on the user's PC).
          $exe = "src-tauri/target/release/leverframe.exe"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents $exe | Out-String
          Write-Output $deps
          if ($deps -match "(?i)vcruntime|msvcp") { throw "Leverframe.exe depends on the VC++ runtime DLLs" }
      - name: Upload portable ZIP (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Leverframe-windows-portable
          path: dist-portable/*.zip
          if-no-files-found: error

  e2e:
    name: E2E (Linux, real app window)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (WebKitGTK, WebDriver, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev webkit2gtk-driver xvfb
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: e2e
      - run: npm ci
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Build the app (debug)
        run: npm run tauri -- build --debug --no-bundle
      - name: Run end-to-end tests
        run: xvfb-run -a npm run e2e
        env:
          E2E_SCREENSHOT: ${{ runner.temp }}/e2e-final.png
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshot
          path: ${{ runner.temp }}/e2e-final.png
          if-no-files-found: ignore

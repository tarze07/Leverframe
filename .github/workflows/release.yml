name: Release

# Pushing a tag such as v0.1.0-alpha.1 builds the installers and publishes a GitHub Release.
# Versions with a suffix (-alpha.1, -beta.2, …) are published as pre-releases.
# The workflow can also be started by hand for an existing tag (Actions → Release → Run workflow),
# e.g. to rebuild and re-upload the installers of a release; an existing release is reused.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.0-alpha.1"
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create or reuse release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
      # Release tools (scripts, portable readme, notes) come from the workflow's own revision, so a
      # manual run for an older tag uses the current tools while building the tag's code.
      - uses: actions/checkout@v5
        with:
          path: release-tools
          sparse-checkout: |
            scripts
            packaging
            CHANGELOG.md
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check version matches tag
        run: node scripts/check-version.mjs "$TAG"
      - name: Create draft release (or reuse the existing one)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(bash release-tools/scripts/ensure-release.sh)
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
      # Release tools (scripts, portable readme, notes) come from the workflow's own revision, so a
      # manual run for an older tag uses the current tools while building the tag's code.
      - uses: actions/checkout@v5
        with:
          path: release-tools
          sparse-checkout: |
            scripts
            packaging
            CHANGELOG.md
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build installers and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
      - name: Package the portable ZIP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh release-tools/packaging/windows/make-portable.ps1
      - name: Upload the portable ZIP to the release (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        # By release id: a draft release cannot be found by its tag.
        run: bash release-tools/scripts/upload-release-asset.sh "$RELEASE_ID" dist-portable/*.zip

  publish:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check that installers were uploaded, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          assets=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '.[].name')
          echo "Assets:"; echo "$assets"
          # .msi and .rpm only exist for versions without a suffix (they reject e.g. "-alpha.1").
          patterns='_x64-setup\.exe$ _x64-portable\.zip$ _amd64\.deb$ _amd64\.AppImage$'
          case "${TAG#v}" in *-*) ;; *) patterns="$patterns _x64_en-US\.msi$ \.x86_64\.rpm$" ;; esac
          for pattern in $patterns; do
            if ! echo "$assets" | grep -Eq "$pattern"; then
              echo "::error::Missing installer matching $pattern"
              exit 1
            fi
          done
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false --jq .html_url

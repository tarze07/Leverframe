name: Obraz z agentami

# Builds the image with agents (packaging/docker/agents) when it changes – to catch a broken
# Dockerfile or an agent that no longer starts. Nothing is published.
on:
  push:
    branches: [main, "claude/**"]
    paths: ["packaging/docker/agents/**", ".github/workflows/docker-image.yml"]
  pull_request:
    paths: ["packaging/docker/agents/**", ".github/workflows/docker-image.yml"]
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build --progress=plain -t leverframe-agents:ci packaging/docker/agents
      - name: Label
        run: test "$(docker image inspect -f '{{ index .Config.Labels "io.leverframe.agents" }}' leverframe-agents:ci)" = 1
      - name: Agents and adapters start
        run: docker run --rm -i leverframe-agents:ci sh -s < packaging/docker/agents/check.sh
      - name: Size
        run: docker image ls leverframe-agents:ci
